{% extends "base.html" %}
{% block content %}
<div class="card">
  <form method="post" action="{{ url_for('upload') }}"
        enctype="multipart/form-data">
    <input type="file" name="pdf" accept="application/pdf">
    <button type="submit">Upload and extract</button>
  </form>
</div>

<div class="card">
  <table>
    <tr><th>File</th><th>Uploaded</th><th>Status</th><th>Blocks</th></tr>
    {% for d in docs %}
    <tr>
      <td><a href="{{ url_for('document', doc_id=d.id) }}">{{ d.title or d.filename }}</a></td>
      <td>{{ d.uploaded_at.strftime('%Y-%m-%d %H:%M') }}</td>
      <td>{{ label.get(phase(d), phase(d)) }}</td>
      <td>{{ d.blocks|length }}</td>
    </tr>
    {% else %}
    <tr><td colspan="4">No documents yet.</td></tr>
    {% endfor %}
  </table>
</div>
{% endblock %}
